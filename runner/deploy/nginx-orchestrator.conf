# /etc/nginx/sites-available/orchestrator.asoracore.com
# Publishes ONLY the dashboard surface. /api/jobs and /api/ops are intentionally
# NOT proxied — they stay loopback-only on 127.0.0.1:8787. certbot adds the TLS
# block + the :80→:443 redirect (run: certbot --nginx -d orchestrator.asoracore.com).
server {
    listen 80;
    listen [::]:80;
    server_name orchestrator.asoracore.com;

    # Personal action board (the owner's browser) + its actions API. Nothing else.
    location = /dash        { proxy_pass http://127.0.0.1:8787; include proxy_params; }
    location = /dash/data   { proxy_pass http://127.0.0.1:8787; include proxy_params; }
    location /api/actions   { proxy_pass http://127.0.0.1:8787; include proxy_params; }

    # Everything else (incl. /api/jobs, /api/ops, /api/health) is not exposed.
    location / { return 404; }
}
